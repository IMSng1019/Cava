# ===========================================================================
# Cava —— Gradle / Loom 构建配置（文件所有权：P0-A 构建基建流）
#
# 硬约束：
#   1. JDK 必须是 21.0.x；javac 必须同时给 --release 21 与 --enable-preview
#      （预览 class 版本 65.65535，JDK 22 即使带 --enable-preview 也拒绝加载）。
#   2. 原生库编译参数固定 -O2 -fwrapv -ffp-contract=off -fno-fast-math
#      （MSVC: /O2 /fp:strict），禁 -march=native / -ffast-math / -Ofast。
#      这一条在根 CMakeLists.txt 里有 check_cxx_compiler_flag 守卫。
#   3. GRADLE_USER_HOME 必须在工作区内（沙箱写不进 J:\mc\mods\.gradle-home）：
#        $env:GRADLE_USER_HOME = 'J:\mc\Cava\.gradle-home'
#      这里**故意不写死绝对路径**（写死会让别的机器/CI 失败），只在文档里说明。
#      细节见 docs/CAVA-p0a-build-infra.md。
# ===========================================================================

# ---- Gradle 本体 ----
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true

# ---- JDK 21 工具链（build.gradle 里 java.toolchain = 21）----
# 不自动下载工具链（不引入 foojay resolver 额外依赖）：本机 / CI 都必须预装 JDK 21。
org.gradle.java.installations.auto-download=false
# 兜底搜索路径：本机常见的 JDK 21 位置。不存在的目录会被 Gradle 忽略（本机已实测）。
# 用正斜杠，避免 .properties 把反斜杠当转义符。别的机器要覆盖：
#   .\gradlew.bat build "-Porg.gradle.java.installations.paths=D:/jdk-21"
org.gradle.java.installations.paths=C:/Program Files/Java/jdk-21,C:/Program Files/Java/jdk-21.0.10,C:/Program Files/Eclipse Adoptium/jdk-21,C:/Program Files/Microsoft/jdk-21

# ---- Fabric ----
# check these on https://fabricmc.net/develop
minecraft_version=1.20.4
yarn_mappings=1.20.4+build.3
loader_version=0.19.5
# Loom 1.18 起插件 id 是 net.fabricmc.fabric-loom-remap（对应 net.fabricmc:fabric-loom）。
# **必须 pin 在 1.17.x**：Loom 1.18.x 的 Gradle module metadata 里 org.gradle.jvm.version=25，
# 在 JDK 21 上直接 "Dependency requires at least JVM runtime version 25"（模板自带 JDK 25 的 CI 就是这个原因）。
# 1.17.20/1.17.21 = jvm 21 + plugin-api 9.5.0，配 Gradle 9.7.1 正常。换版本前先查：
#   https://maven.fabricmc.net/net/fabricmc/fabric-loom/<v>/fabric-loom-<v>.module 里的 org.gradle.jvm.version
loom_version=1.17.20

# ---- Mod ----
# 版本号与契约 §4.2 的黄金轨迹头 "cava":"0.1.0"、cava_abi.h 里 cava_build_id 的示例一致。
version=0.1.0
group=cava

# ---- 依赖版本 ----
# captain 决定（广播 #3 · 决定 2）：构建期必须与服务器实际 jar 一致 -> 0.96.11+1.20.4
# （模板自带的是 0.97.3；解析不到就立刻报告，不要自己换回去）
fabric_api_version=0.96.11+1.20.4
# 纯 Java 单测（离线比对器）；junit-platform-launcher 必须显式给（Gradle 9 要求）
junit_version=5.11.4
junit_platform_version=1.11.4
