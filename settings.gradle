// 构建前置（本机实测，必须）：GRADLE_USER_HOME 必须在工作区内，否则沙箱拒绝写缓存：
//   $env:GRADLE_USER_HOME = 'J:\mc\Cava\.gradle-home'
//   .\gradlew.bat build --console=plain
// 这里故意不写死绝对路径（写死会让别的机器/CI 失败）。细节见 docs/CAVA-p0a-build-infra.md。

pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Should match your modid
rootProject.name = 'cava'
